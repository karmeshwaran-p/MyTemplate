version: '3.8'

services:
  web:
    image: ghcr.io/karmeshwaran-p/mytemplate:latest
    restart: always
    ports:
      - "5000:5000"
    environment:
      - APPNAME_ENV=prod
      - SECRET_KEY=${SECRET_KEY:-devsecretkey12345}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
